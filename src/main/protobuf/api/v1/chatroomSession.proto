syntax = "proto3";

import "scalapb/scalapb.proto";
import "google/protobuf/any.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;

package server.grpc.chat;

service ChatRoomSession {

  rpc Post (stream LiveClientMessage) returns (stream LiveServerMessage) {}
}

message UserInfo {
  string user = 1 [(scalapb.field).type = "shared.Domain.Participant"];
  bytes pubKey = 2;
}

message Coords {
  double lat = 1;
  double lon = 2;
}

message LiveClientMessage {
  string chat = 1 [(scalapb.field).type = "shared.Domain.ChatName"];
  map<string, bytes> content = 2;
  UserInfo userInfo = 3 [(scalapb.field).no_box = true];
  Coords coords = 4 [(scalapb.field).no_box = true];
  string otp = 5 [(scalapb.field).type = "shared.Domain.Otp"];
}

message ServerCmd {
  oneof sealed_value {
    LiveServerMessage liveServerMessage = 1;

    //internal cmd
    FetchRecentHistory fetchRecentHistory = 2;
  }
}

message LiveServerMessage {
  string chat = 1 [(scalapb.field).type = "shared.Domain.ChatName"];
  map<string, bytes> content = 2;
  UserInfo userInfo = 3 [(scalapb.field).no_box = true];
  string timeUuid = 4 [(scalapb.field).type = "shared.Domain.CassandraTimeUUID"];
  string bucketName = 5 [(scalapb.field).type = "shared.Domain.BucketName"];
  bool isNewBucketStarted = 6;
}

message FetchRecentHistory {
  string chat = 1 [(scalapb.field).type = "shared.Domain.ChatName"];
  string bucketName = 2 [(scalapb.field).type = "shared.Domain.BucketName"];
}
